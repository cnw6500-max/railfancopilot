name: iosApp
options:
  bundleIdPrefix: com.railfancopilot
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/shared.xcframework
        embed: true
        codeSign: true
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseStorage
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleName: Railfan Copilot
        CFBundleDisplayName: Railfan Copilot
        CFBundleShortVersionString: "2.7.1"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: "Railfan Copilot uses your location to show nearby trains on the map and sort scanner feeds by distance. Location data is not stored or shared."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Railfan Copilot uses your location in the background to send proximity alerts when trains approach your saved locations."
        NSCameraUsageDescription: "Railfan Copilot uses the camera to take photos for the AI locomotive identifier."
        NSPhotoLibraryUsageDescription: "Railfan Copilot accesses your photo library to select images for the AI locomotive identifier."
        NSPhotoLibraryAddUsageDescription: "Railfan Copilot saves locomotive photos to your library."
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Railfan Copilot uses the microphone for voice-to-text when reporting train sightings."
        NSSpeechRecognitionUsageDescription: "Railfan Copilot uses speech recognition to transcribe voice sighting reports."
        NSAppTransportSecurity:
          NSExceptionDomains:
            dieselshop.us:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
            nsdash9.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
            railroadradio.net:
              NSIncludesSubdomains: true
              NSExceptionMinimumTLSVersion: TLSv1.0
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        aps-environment: production
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ronminor.railfancopilot
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: "YES"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "7K7CYUNXTT"
      CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ronminor.railfancopilotUITests
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "7K7CYUNXTT"

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - name: iosAppUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: Release
      postActions:
        - name: Generate dSYMs for SPM frameworks
          script: |
            #!/bin/bash
            set -e
            FRAMEWORKS_DIR="${ARCHIVE_PATH}/Products/Applications/${WRAPPER_NAME}/Frameworks"
            DSYMS_DIR="${ARCHIVE_PATH}/dSYMs"
            if [ ! -d "$FRAMEWORKS_DIR" ]; then exit 0; fi
            for FW in "$FRAMEWORKS_DIR"/*.framework; do
              FW_NAME=$(basename "$FW")
              DSYM_PATH="${DSYMS_DIR}/${FW_NAME}.dSYM"
              BINARY="${FW}/${FW_NAME%.framework}"
              if [ -d "$DSYM_PATH" ] || [ ! -f "$BINARY" ]; then continue; fi
              dsymutil "$BINARY" -o "$DSYM_PATH" 2>/dev/null || true
              echo "Generated: ${FW_NAME}.dSYM"
            done
          settingsTarget: iosApp
