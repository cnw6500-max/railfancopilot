name: iosApp
options:
  bundleIdPrefix: com.railfancopilot
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/shared.xcframework
        embed: true
        codeSign: true
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleName: Railfan Copilot
        CFBundleDisplayName: Railfan Copilot
        CFBundleShortVersionString: "2.5.8"
        CFBundleVersion: "36"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: "Railfan Copilot uses your location to show nearby trains on the map and sort scanner feeds by distance. Location data is not stored or shared."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Railfan Copilot uses your location in the background to send proximity alerts when trains approach your saved locations."
        NSCameraUsageDescription: "Railfan Copilot uses the camera to take photos for the AI locomotive identifier."
        NSPhotoLibraryUsageDescription: "Railfan Copilot accesses your photo library to select images for the AI locomotive identifier."
        NSPhotoLibraryAddUsageDescription: "Railfan Copilot saves locomotive photos to your library."
        NSAppTransportSecurity:
          NSExceptionDomains:
            dieselshop.us:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
            nsdash9.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.0
            railroadradio.net:
              NSIncludesSubdomains: true
              NSExceptionMinimumTLSVersion: TLSv1.0
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        aps-environment: production
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ronminor.railfancopilot
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: "YES"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "7K7CYUNXTT"
      CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
