name: iOS App Store Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to App Store Connect
    runs-on: macos-15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (for Kotlin/Gradle) ──────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 4. Build KMP XCFramework ─────────────────────────────────────────────
      - name: Build shared XCFramework
        run: ./gradlew :shared:assembleXCFramework

      # ── 5. Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 6. Inject API keys from GitHub Secrets → Secrets.swift ──────────────
      - name: Create Secrets.swift
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METRA_USER: ${{ secrets.METRA_USER }}
          METRA_PASSWORD: ${{ secrets.METRA_PASSWORD }}
          MTA_API_KEY: ${{ secrets.MTA_API_KEY }}
          FIVE_ELEVEN_KEY: ${{ secrets.FIVE_ELEVEN_KEY }}
        run: |
          cat > iosApp/iosApp/Secrets.swift << EOF
          import Foundation

          enum Secrets {
              static let anthropicApiKey  = "$ANTHROPIC_API_KEY"
              static let metraUser        = "$METRA_USER"
              static let metraPassword    = "$METRA_PASSWORD"
              static let mtaApiKey        = "$MTA_API_KEY"
              static let fiveElevenKey    = "$FIVE_ELEVEN_KEY"
          }
          EOF

      # ── 7. Generate Xcode project ─────────────────────────────────────────────
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # ── 8. Import Apple signing certificate & provisioning profile ───────────
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # ── 9. Archive ────────────────────────────────────────────────────────────
      - name: Archive
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination generic/platform=iOS \
            archive \
            -archivePath $RUNNER_TEMP/RailfanCopilot.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=7K7CYUNXTT

      # ── 10. Export options plist ──────────────────────────────────────────────
      - name: Write ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>7K7CYUNXTT</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          EOF

      # ── 11. Export & Upload to App Store Connect ──────────────────────────────
      - name: Export & Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          # Write the App Store Connect API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/RailfanCopilot.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/AppStoreExport \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
